    <!--
      Inline theme detection: aplica data-theme ANTES de que el CSS se pinte
      para evitar cualquier flash de tema incorrecto. Lee localStorage igual
      que darkMode.ts, pero sin importar ningún módulo.
    -->
    <script>
      try {
        var t = localStorage.getItem('imp-lux-theme')
        if (t === 'dark' || t === 'light') {
          document.documentElement.dataset.theme = t
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (_) {}
    </script>

    <!--
      Preloads: navegador descarga CSS y JS en paralelo desde el <head>.
      El CSS del bundle solo contiene theme.scss (vars + reset, ~1 KB).
      El CSS de cada modo se inyecta vía ?inline desde su bootstrap.
      El entry JS es muy pequeño (~4 KB); bootstraps cargan on-demand.
    -->
    <link rel="preload" href="imp-lux-ocp-style-selector.css" as="style" />
    <link rel="preload" href="imp-lux-ocp-style-selector.js" as="script" crossorigin />

    <!--
      modulepreload para el modo configurator (default).
      El browser descarga estos chunks desde el <head>, antes de que React
      arranque, para que executePhase1 los tenga en caché y resuelva sin latencia.
      Sin preload: los 5 módulos de init se descubrían tarde (Model → useInitStrategy → executePhase1).
      Con preload: un único chunk (9 KB gz) ya disponible cuando se necesita.
    -->
    <link rel="modulepreload" href="chunks/bootstrap-configurator.js" crossorigin />
    <link rel="modulepreload" href="chunks/configurator-init.js" crossorigin />

    <link rel="stylesheet" href="imp-lux-ocp-style-selector.css" />
  </head>
  <body>
    <!--
      El modo activo (wizard | configurator) se detecta en main.tsx:
        ?mode=wizard   → carga bootstrap wizard
        por defecto    → carga bootstrap configurator

      El skeleton de cada modo es renderizado por React inmediatamente después
      del mount, con los estilos inyectados desde el bootstrap (?inline).
    -->
    <div
      id="imp-lux-ocp-style-selector"
      role="region"
      aria-label="Style Selector"
      aria-busy="true"
    ></div>

    <!--
      type="module" activa ES modules nativos.
      El entry (~4 KB) hace el setup síncrono (tema, modo) y luego
      dispara el import del bootstrap correspondiente de forma lazy.
    -->
    <script type="module" src="imp-lux-ocp-style-selector.js"></script>
  </body>
